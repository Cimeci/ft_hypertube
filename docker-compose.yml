services:
  postgres:
    image: postgres:15
    container_name: hypertube_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hypertube
      POSTGRES_PASSWORD: hypertube
      POSTGRES_DB: hypertube
    ports:
      - "5432:5432"
    volumes:
      - hypertube_postgres_data:/var/lib/postgresql/data

volumes:
  hypertube_postgres_data: